---
name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly-2024-12-14

jobs:
  fast-checks:
    name: 🏁 Fast Checks (Format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ubuntu
      - name: pin
        run: rustup override set ${RUSTUP_TOOLCHAIN}
      - name: Install required components
        run: rustup component add rustfmt
      - name: Install taplo
        run: cargo install taplo-cli --locked
      - name: Run format checks
        run: |
          taplo format --check --config taplo.toml
          cargo fmt --all -- --check

  clippy:
    name: 🤖 Clippy (Ubuntu)
    runs-on: ubuntu-latest
    needs: fast-checks
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-shared-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-shared-
      - uses: ./.github/actions/ubuntu
      - name: Install protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: pin
        run: rustup override set ${RUSTUP_TOOLCHAIN}
      - name: Install required components
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src clippy
      - name: Run clippy
        run: SKIP_WASM_BUILD=1 cargo clippy --locked --workspace
      - name: Save cache key
        if: always()
        run: echo "${{ runner.os }}-cargo-shared-${{ hashFiles('**/Cargo.lock') }}" > cache-key-ubuntu.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-key-ubuntu-clippy
          path: cache-key-ubuntu.txt

  doc:
    name: 📚 Doc (Ubuntu)
    runs-on: ubuntu-latest
    needs: fast-checks
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-shared-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-shared-
      - uses: ./.github/actions/ubuntu
      - name: Install protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: pin
        run: rustup override set ${RUSTUP_TOOLCHAIN}
      - name: Install required components
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
      - name: Run doc
        run: SKIP_WASM_BUILD=1 cargo doc --locked --workspace --no-deps

  tests-ubuntu:
    name: 🧪 Tests (Ubuntu)
    runs-on: ubuntu-latest
    needs: fast-checks
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-shared-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-shared-
      - uses: ./.github/actions/ubuntu
      - name: Install protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: pin
        run: rustup override set ${RUSTUP_TOOLCHAIN}
      - name: Install required components
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
      - name: Run tests
        run: SKIP_WASM_BUILD=1 cargo test --locked --workspace

  build-ubuntu:
    name: 🏗️ Build (Ubuntu)
    runs-on: ubuntu-latest
    needs: fast-checks
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-shared-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-shared-
      - uses: ./.github/actions/ubuntu
      - name: Install protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: pin
        run: rustup override set ${RUSTUP_TOOLCHAIN}
      - name: Install required components
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
      - name: Build project
        run: cargo build --locked --workspace

  build-macos:
    name: 🍏 Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
      - uses: ./.github/actions/macos
      - name: Install protobuf
        run: brew install protobuf
      - name: pin
        run: rustup override set ${RUSTUP_TOOLCHAIN}
      - name: Install required components
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src
      - name: Build project
        run: cargo build --locked --workspace
      - name: Save cache key
        if: always()
        run: echo "${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}" > cache-key-macos.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-key-macos
          path: cache-key-macos.txt

  cleanup-cache:
    name: 🧹 Cleanup Cache
    runs-on: ubuntu-latest
    needs: [clippy, doc, tests-ubuntu, build-ubuntu, build-macos]
    if: always()
    steps:
      - name: Download all cache key artifacts
        uses: actions/download-artifact@v4
        with:
          path: cache-keys
      - name: Cleanup build cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting caches..."
          find cache-keys -type f -name "*.txt" -print0 | xargs -0 cat | sort -u | while read -r cache_key; do
            echo "Attempting to delete cache with key: $cache_key"
            gh cache delete "$cache_key" --repo ${{ github.repository }} --confirm || echo "Could not delete cache key $cache_key. It might have already been deleted or not found."
          done
