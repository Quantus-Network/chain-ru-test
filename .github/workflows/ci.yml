---
name: continuous integration

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly-2024-12-14

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/disk
      - uses: ./.github/actions/ubuntu
      - name: pin
        run: rustup override set ${RUSTUP_TOOLCHAIN}
      - name: Install tools
        run: |
          cargo install taplo-cli --locked
          rustup component add rustfmt
          rustup component add clippy
      - name: taplo
        run: taplo format --check --config taplo.toml
      - name: format
        run: cargo fmt --all -- --check
        timeout-minutes: 5
      - name: clippy
        run: SKIP_WASM_BUILD=1 cargo clippy --locked --workspace
        timeout-minutes: 30
      - name: doc
        run: SKIP_WASM_BUILD=1 cargo doc --locked --workspace --no-deps
        timeout-minutes: 15

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/disk
      - uses: ./.github/actions/ubuntu
      - name: pin
        run: rustup override set ${RUSTUP_TOOLCHAIN}
      - name: test
        run: SKIP_WASM_BUILD=1 cargo test --locked --workspace
        timeout-minutes: 15

  compile-benchmarks:
    name: Compile Benchmarks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup macOS
        if: contains(matrix.os, 'macos')
        uses: ./.github/actions/macos
      - name: Setup Ubuntu
        if: contains(matrix.os, 'ubuntu')
        uses: ./.github/actions/ubuntu
      - name: pin
        run: rustup override set ${RUSTUP_TOOLCHAIN}
      - name: compile
        run: cargo build --locked --workspace
        timeout-minutes: 90
      - name: compile with benchmarks
        run: cargo check --locked --workspace --features runtime-benchmarks
        timeout-minutes: 90
