---
name: continuous integration

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly-2024-12-14

jobs:
  build-ubuntu:
    name: Prepare Build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: ./.github/actions/disk
      - uses: ./.github/actions/ubuntu
      - name: Install protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: pin
        run: rustup override set ${RUSTUP_TOOLCHAIN}
      - name: Install tools
        run: |
          cargo install taplo-cli --locked
          cargo install cargo-nextest --locked
          rustup component add rustfmt clippy
      - name: Build project
        run: cargo build --locked --workspace
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-build-artifacts
          path: |
            target
            ~/.cargo/bin/
      - name: Save cache key
        if: always()
        run: echo "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}" > cache-key-build-ubuntu.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-key-build-ubuntu
          path: cache-key-build-ubuntu.txt

  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    needs: build-ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-build-artifacts
          path: .
      - name: Restore executables
        run: |
          mkdir -p ~/.cargo
          mv bin ~/.cargo/
          chmod -R +x ~/.cargo/bin
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: pin
        run: rustup override set ${RUSTUP_TOOLCHAIN}
      - name: taplo
        run: taplo format --check --config taplo.toml
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: SKIP_WASM_BUILD=1 cargo clippy --locked --workspace
      - name: doc
        run: SKIP_WASM_BUILD=1 cargo doc --locked --workspace --no-deps

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: build-ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-build-artifacts
          path: .
      - name: Restore executables
        run: |
          mkdir -p ~/.cargo
          mv bin ~/.cargo/
          chmod -R +x ~/.cargo/bin
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: pin
        run: rustup override set ${RUSTUP_TOOLCHAIN}
      - name: test
        run: SKIP_WASM_BUILD=1 cargo nextest run --locked --workspace

  compile-benchmarks-macos:
    name: Compile Benchmarks (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: ./.github/actions/macos
      - name: Install protobuf
        run: brew install protobuf
      - name: pin
        run: rustup override set ${RUSTUP_TOOLCHAIN}
      - name: compile
        run: cargo build --locked --workspace
        timeout-minutes: 90
      - name: compile with benchmarks
        run: cargo check --locked --workspace --features runtime-benchmarks
        timeout-minutes: 90
      - name: Save cache key
        if: always()
        run: echo "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}" > cache-key-compile-macos.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-key-compile-macos
          path: cache-key-compile-macos.txt

  cleanup-cache:
    name: Cleanup Cache
    runs-on: ubuntu-latest
    needs: [build-ubuntu, compile-benchmarks-macos, quality-checks, tests]
    if: always()
    steps:
      - name: Download all cache key artifacts
        uses: actions/download-artifact@v4
        with:
          path: cache-keys
      - name: Cleanup build cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting caches..."
          find cache-keys -type f -name "*.txt" -print0 | xargs -0 cat | sort -u | while read -r cache_key; do
            echo "Attempting to delete cache with key: $cache_key"
            gh cache delete "$cache_key" --repo ${{ github.repository }} --confirm || echo "Could not delete cache key $cache_key. It might have already been deleted or not found."
          done
