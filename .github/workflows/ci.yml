---
name: continuous integration

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly-2024-12-14

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo dependencies
        id: cache-cargo-quality
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: ./.github/actions/disk
      - uses: ./.github/actions/ubuntu
      - name: Install protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: pin
        run: rustup override set ${RUSTUP_TOOLCHAIN}
      - name: Install tools
        run: |
          if [[ "${{ steps.cache-cargo-quality.outputs.cache-hit }}" != 'true' ]]; then
            cargo install taplo-cli --locked
          fi
          rustup component add rustfmt clippy
      - name: taplo
        run: taplo format --check --config taplo.toml
      - name: format
        run: cargo fmt --all -- --check
        timeout-minutes: 5
      - name: clippy
        run: SKIP_WASM_BUILD=1 cargo clippy --locked --workspace
        timeout-minutes: 30
      - name: doc
        run: SKIP_WASM_BUILD=1 cargo doc --locked --workspace --no-deps
        timeout-minutes: 15
      - name: Save cache key
        if: always()
        run: echo "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}" > cache-key-quality.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-key-quality
          path: cache-key-quality.txt

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo dependencies
        id: cache-cargo-tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: ./.github/actions/disk
      - uses: ./.github/actions/ubuntu
      - name: Install protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: pin
        run: rustup override set ${RUSTUP_TOOLCHAIN}
      - name: Install nextest
        if: steps.cache-cargo-tests.outputs.cache-hit != 'true'
        run: cargo install cargo-nextest --locked
      - name: test
        run: SKIP_WASM_BUILD=1 cargo nextest run --locked --workspace
        timeout-minutes: 15
      - name: Save cache key
        if: always()
        run: echo "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}" > cache-key-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-key-tests
          path: cache-key-tests.txt

  compile-benchmarks:
    name: Compile Benchmarks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Setup macOS
        if: contains(matrix.os, 'macos')
        uses: ./.github/actions/macos
      - name: Setup Ubuntu
        if: contains(matrix.os, 'ubuntu')
        uses: ./.github/actions/ubuntu
      - name: Install protobuf
        if: contains(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: pin
        run: rustup override set ${RUSTUP_TOOLCHAIN}
      - name: compile
        run: cargo build --locked --workspace
        timeout-minutes: 90
      - name: compile with benchmarks
        run: cargo check --locked --workspace --features runtime-benchmarks
        timeout-minutes: 90
      - name: Save cache key
        if: always()
        run: echo "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}" > cache-key-compile-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-key-compile-${{ matrix.os }}
          path: cache-key-compile-${{ matrix.os }}.txt

  cleanup-cache:
    name: Cleanup Cache
    runs-on: ubuntu-latest
    needs: [quality-checks, tests, compile-benchmarks]
    if: always()
    steps:
      - name: Download all cache key artifacts
        uses: actions/download-artifact@v4
        with:
          path: cache-keys
      - name: Cleanup build cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting caches..."
          find cache-keys -type f -name "*.txt" -print0 | xargs -0 cat | sort -u | while read -r cache_key; do
            echo "Attempting to delete cache with key: $cache_key"
            gh cache delete "$cache_key" --repo ${{ github.repository }} --confirm || echo "Could not delete cache key $cache_key. It might have already been deleted or not found."
          done
